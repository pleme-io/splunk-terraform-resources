[resource]
name = "splunk_apps_local"
description = "Manages locally installed Splunk apps"
category = "apps"

[crud]
create_endpoint = "/services/apps/local"
create_schema = "AppInstall"
update_endpoint = "/services/apps/local/{name}"
update_schema = "AppUpdate"
read_endpoint = "/services/apps/local/{name}"
read_schema = "AppGet"
delete_endpoint = "/services/apps/local/{name}"
delete_schema = "AppDelete"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields.name]
type = "String"
required = true
description = "App name (ID)"

[fields.filename]
type = "Boolean"
required = false
description = "Whether to install from a file"

[fields.explicit_appname]
type = "String"
required = false
description = "Explicit app name to use during install"

[fields.update]
type = "Boolean"
required = false
description = "Whether to update the app if it already exists"

[fields.auth]
type = "String"
required = false
description = "Splunkbase session token for authenticated installs"

[fields.label]
type = "String"
required = false
description = "Human-readable label for the app"

[fields.visible]
type = "Boolean"
required = false
description = "Whether the app is visible in the Splunk UI"

[fields.version]
computed = true
description = "Installed version of the app"
