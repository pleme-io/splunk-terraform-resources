[resource]
name = "splunk_inputs_http_event_collector"
description = "Manages a Splunk HTTP Event Collector (HEC) input"
category = "inputs"

[crud]
create_endpoint = "/servicesNS/admin/splunk_httpinput/data/inputs/http"
create_schema = "HecInputCreate"
update_endpoint = "/servicesNS/admin/splunk_httpinput/data/inputs/http/{name}"
update_schema = "HecInputUpdate"
read_endpoint = "/servicesNS/admin/splunk_httpinput/data/inputs/http/{name}"
read_schema = "HecInputGet"
delete_endpoint = "/servicesNS/admin/splunk_httpinput/data/inputs/http/{name}"
delete_schema = "HecInputDelete"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields.name]
type = "String"
required = true
description = "HEC input name"

[fields.index]
type = "String"
required = false
description = "Default index for events"

[fields.indexes]
type = "List"
required = false
description = "Set of allowed indexes"

[fields.source]
type = "String"
required = false
description = "Default source value"

[fields.sourcetype]
type = "String"
required = false
description = "Default sourcetype value"

[fields.disabled]
type = "Boolean"
required = false
description = "Whether the input is disabled"

[fields.use_ack]
type = "Boolean"
required = false
description = "Enable indexer acknowledgment"

[fields.token]
type = "String"
computed = true
sensitive = true
description = "HEC token (auto-generated)"
