[resource]
name = "splunk_saved_searches"
description = "Manages a Splunk saved search (alerts, reports, scheduled searches)"
category = "saved_searches"

[crud]
create_endpoint = "/servicesNS/admin/search/saved/searches"
create_schema = "SavedSearchCreate"
update_endpoint = "/servicesNS/admin/search/saved/searches/{name}"
update_schema = "SavedSearchUpdate"
read_endpoint = "/servicesNS/admin/search/saved/searches/{name}"
read_schema = "SavedSearchGet"
delete_endpoint = "/servicesNS/admin/search/saved/searches/{name}"
delete_schema = "SavedSearchDelete"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields.name]
type = "String"
required = true
description = "Name of the saved search"

[fields.search]
type = "String"
required = true
description = "SPL search query"

[fields.cron_schedule]
type = "String"
required = false
description = "Cron expression for scheduling the search"

[fields.is_scheduled]
type = "Boolean"
required = false
description = "Whether the search is scheduled"

[fields.is_visible]
type = "Boolean"
required = false
description = "Whether the search is visible in the UI"

[fields.disabled]
type = "Boolean"
required = false
description = "Whether the saved search is disabled"

[fields.dispatch_earliest_time]
type = "String"
required = false
description = "Earliest time for the search window"

[fields.dispatch_latest_time]
type = "String"
required = false
description = "Latest time for the search window"

[fields.dispatch_buckets]
type = "Integer"
required = false
description = "Number of event buckets for search results"

[fields.dispatch_max_count]
type = "Integer"
required = false
description = "Maximum number of results"

[fields.alert_type]
type = "String"
required = false
description = "Type of alert"
enum = ["number of events", "number of hosts", "number of sources", "custom", "always"]

[fields.alert_threshold]
type = "String"
required = false
description = "Threshold for triggering the alert"

[fields.alert_comparator]
type = "String"
required = false
description = "Comparator for alert threshold"
enum = ["greater than", "less than", "equal to", "rises by", "drops by", "rises by perc", "drops by perc"]

[fields.actions]
type = "String"
required = false
description = "Comma-separated list of alert actions to trigger"

[fields.action_email_to]
type = "String"
required = false
description = "Email addresses for the email alert action"

[fields.description]
type = "String"
required = false
description = "Description of the saved search"
