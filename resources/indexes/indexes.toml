[resource]
name = "splunk_indexes"
description = "Manages a Splunk index for data storage and retention"
category = "indexes"

[crud]
create_endpoint = "/services/data/indexes"
create_schema = "IndexCreate"
update_endpoint = "/services/data/indexes/{name}"
update_schema = "IndexUpdate"
read_endpoint = "/services/data/indexes/{name}"
read_schema = "IndexGet"
delete_endpoint = "/services/data/indexes/{name}"
delete_schema = "IndexDelete"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields.name]
type = "String"
required = true
description = "Name of the index"

[fields.datatype]
type = "String"
required = false
description = "Type of index data"
enum = ["event", "metric"]

[fields.max_data_size_mb]
type = "Integer"
required = false
description = "Maximum size of a hot/warm bucket in MB"

[fields.max_warm_db_count]
type = "Integer"
required = false
description = "Maximum number of warm buckets"

[fields.max_total_data_size_mb]
type = "Integer"
required = false
description = "Maximum total size of the index in MB"

[fields.frozen_time_period_in_secs]
type = "Integer"
required = false
description = "Seconds after which buckets are frozen (archived/deleted)"

[fields.home_path]
type = "String"
required = false
description = "Path for hot and warm buckets"

[fields.cold_path]
type = "String"
required = false
description = "Path for cold buckets"

[fields.thawed_path]
type = "String"
required = false
description = "Path for thawed buckets"

[fields.cold_to_frozen_dir]
type = "String"
required = false
description = "Destination path when buckets are frozen"
